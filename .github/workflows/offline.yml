name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADIO_ANALYTICS_ENABLED: 'False'
      ACS_LLM_API_KEY: ''
      ACS_EMBEDDING_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.8
      - run: uv sync --extra dev --frozen
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run python scripts/check_secrets.py --all-tracked
