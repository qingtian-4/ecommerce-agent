<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电商智能客服 · V3</title><link rel="stylesheet" href="/shop/assets/style.css"><script type="module" src="/shop/assets/app.js"></script></head>
<body><a class="skip-link" href="#message">跳到消息输入</a><div class="app">
<header class="topbar"><div class="identity"><span class="logo" aria-hidden="true">◉</span><div><h1>电商智能客服 <small>V3</small></h1><p>面向消费者的对话式购物与售后服务</p></div></div><nav><details class="runtime"><summary id="runtime-mode">正在连接</summary><p id="runtime-notice"></p></details><button id="nav-orders" class="text-btn">我的订单</button><button id="help" class="text-btn">帮助中心</button></nav></header>
<main class="layout"><section class="chat-panel" aria-label="客服对话"><div class="chat-head"><div class="identity"><span class="avatar" aria-hidden="true">♧</span><div><h2>在线智能客服 <small>AI</small></h2><p id="connection" role="status">正在建立连接</p></div></div><div class="head-actions"><button id="mobile-service" class="outline">订单与售后</button><button id="human" class="outline">转人工</button></div></div>
<div class="chat-history"><div id="chat" class="chat-scroll" aria-label="聊天记录" aria-live="polite"></div><button id="jump-latest" class="jump-latest" type="button" aria-label="回到最新消息" aria-controls="chat" title="回到最新消息" hidden><span aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14m-6-6 6 6 6-6"/></svg></span></button></div><div id="activity" class="sr-only" role="status"></div><div id="global-error" class="inline-error" role="alert" hidden></div>
<div class="composer"><div id="quick" class="quick" aria-label="提问示例"></div><form id="compose" class="composebox"><label for="message" class="sr-only">输入消息</label><textarea id="message" rows="1" placeholder="输入你的问题，或选择上方的快捷操作…" maxlength="4000" required></textarea><button id="send" type="submit" aria-label="发送消息" disabled>↑</button></form><div class="composefoot"><span>Enter 发送 · Shift + Enter 换行</span><span>合成业务演示 · 申请结果以数据库回执为准</span></div><button id="resume" class="text-btn" hidden>核对并恢复上次对话</button></div></section>
<aside id="desktop-context" class="side-panel"><div class="side-top"><small>YOUR SERVICE · 当前服务</small><h2>订单与售后</h2></div><div id="service-content" class="side-inner"><section id="context-order" class="context-card"></section><section id="context-task" class="context-card"></section><p class="trust">基于权威事实的客服体验<br>订单状态和申请结果来自服务端数据库及完整业务回执。</p><details class="data-notice"><summary>关于本机合成演示</summary><p>用户、商品、订单均为合成样例，商品图标是类别示意图，非商品实拍。不会办理真实平台售后、审核或退款。</p></details></div></aside></main>
<details class="developer"><summary>开发者执行记录</summary><ol id="trace"></ol></details></div>
<dialog id="context-drawer" class="context-drawer"><div class="dialog-head"><h2>订单与售后</h2><button id="close-context" class="text-btn" aria-label="关闭当前服务">关闭</button></div><div id="drawer-content"></div></dialog>
<dialog id="dialog" class="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" class="text-btn" aria-label="关闭对话框">关闭</button></div><div id="dialog-content"></div></dialog>
</body></html>
